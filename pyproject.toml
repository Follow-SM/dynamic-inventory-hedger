[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dynamic-inventory-hedger"
version = "0.1.0"
description = "Delta-hedge Polymarket crypto positions on Binance USD-M perps, driven by FollowSM microstructure toxicity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "followsm-sdk>=1.6.0",
    "ccxt>=4.4",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
research = ["matplotlib>=3.9"]

[project.scripts]
dynamic-inventory-hedger = "dynamic_inventory_hedger.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_inventory_hedger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["σ", "φ", "Δ", "−", "·"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"
